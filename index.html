<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNPP Simulator</title>
<style>
:root{
  --g:#00915A;        /* bank green */
  --gd:#006A43;       /* dark green */
  --gdd:#0B3B2A;      /* deep green */
  --gl:#7CC9A6;       /* light green */
  --gp:#E7F4EE;       /* pale green */
  --ink:#121212;      /* black */
  --mut:#5B6560;
  --line:#DDE4E0;
  --bg:#F5F7F6;
  --amber:#F5B400;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Segoe UI",system-ui,-apple-system,sans-serif}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gl)}

/* ---------- top bar ---------- */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:100}
.top-in{display:flex;align-items:center;gap:24px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:18px;letter-spacing:.02em}
.brand b{font-weight:800}
.crumbs{display:flex;gap:8px;font-size:14px;color:#b9c4bf;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:#fff}
.crumbs a:hover{color:var(--gl)}

/* ---------- home ---------- */
.hero{background:linear-gradient(120deg,var(--gdd),var(--gd) 55%,var(--g));color:#fff;padding:56px 0 64px}
.hero h1{font-size:40px;line-height:1.15;margin:8px 0 12px;font-weight:800}
.hero p{max-width:640px;margin:0;color:#dcefe6;font-size:17px}
.h2{font-size:22px;margin:40px 0 16px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.card.on{cursor:pointer}
.card.on:hover{border-color:var(--g);box-shadow:0 8px 24px rgba(0,106,67,.12);transform:translateY(-2px)}
.card .num{width:40px;height:40px;border-radius:10px;background:var(--gp);color:var(--gd);display:grid;place-items:center;font-weight:800}
.card.off{opacity:.6}
.card.off .num{background:#eceeed;color:#888}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--mut);font-size:14px;flex:1}
.prog{height:6px;background:#e9eeeb;border-radius:9px;overflow:hidden}
.prog div{height:100%;background:var(--g)}
.card .meta{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between}
.tag{font-size:12px;font-weight:700;color:#888;background:#eee;border-radius:20px;padding:2px 10px;align-self:flex-start}

/* ---------- module ---------- */
.mod-hero{background:var(--gdd);color:#fff;padding:34px 0 38px}
.mod-hero h1{margin:6px 0 6px;font-size:32px;font-weight:800}
.mod-hero p{margin:0;color:#cfe5da}
.mod-layout{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-top:28px;padding-bottom:70px;align-items:start}
.toc{position:sticky;top:78px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.toc-h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.toc a{display:block;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600;font-size:14px;line-height:1.35}
.toc a small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.toc a:hover{background:var(--gp)}
.toc a.ph{color:#999}
.ok{color:var(--g);font-weight:800}
.lesson{background:#fff;border:1px solid var(--line);border-radius:14px;padding:38px 44px;margin-bottom:28px;scroll-margin-top:78px}
.lesson-kicker{font-size:12px;font-style:italic;color:var(--mut)}
.lesson h2{font-size:32px;line-height:1.2;margin:6px 0 16px;font-weight:800}
.bar{width:110px;height:5px;background:var(--g);border-radius:3px;margin-bottom:28px}
.prose p{margin:0 0 16px}
.split{display:grid;grid-template-columns:minmax(260px,1fr) 1fr;gap:28px;align-items:center;margin:26px 0}
.figure{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.figure svg{width:100%;height:auto;display:block}
.figcap{font-size:12.5px;color:var(--mut);margin-top:6px;text-align:center}
.band{background:#F0F2F1;margin:34px -44px 22px;padding:22px 44px 18px;font-size:22px;font-weight:800}
.band:before{content:"";display:block;width:52px;height:4px;background:var(--g);margin-bottom:12px;border-radius:2px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.mode{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.mode .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#eceeed;font-size:18px}
.mode.upd{border-color:var(--gl);background:var(--gp)}
.mode.upd .ic{background:var(--g);color:#fff}
.mode b{display:block}
.mode span{font-size:13.5px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 6px}
.t th{background:var(--g);color:#fff;text-align:left;padding:9px 12px;font-weight:700}
.t td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
.t td:first-child{font-weight:600;white-space:nowrap}
.badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;margin-right:8px}

/* notebook schema */
.ns{max-width:520px;margin:20px auto 8px;border:1px solid #9aa;background:#fff;font:12px "Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ns > div{position:relative;padding:5px 8px;border-bottom:1px solid #e3e3e3}
.ns .nb{position:absolute;right:-30px;top:50%;transform:translateY(-50%)}
.ns .nb .badge{margin:0}
.ns-tabs span{display:inline-block;border:1px solid #ccc;padding:0 6px;margin-right:2px;background:#f3f3f3}
.ns-tabs span.on{background:#fff;font-weight:700}
.ns-body{height:70px;background:repeating-linear-gradient(#fff 0 14px,#f2f4f3 14px 16px)}
.ns-mode{display:inline-block;border:1px solid #999;background:#e1e1e1;padding:1px 14px}

/* profiles */
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.pcard{border:1px solid var(--line);border-top:4px solid var(--g);border-radius:10px;padding:12px 14px}
.pcard b{display:block;margin-bottom:2px}
.pcard span{font-size:13px;color:var(--mut);line-height:1.45;display:block}
ol.big{padding-left:22px}
ol.big li{margin:6px 0}
.note{background:var(--gp);border-left:4px solid var(--g);padding:12px 16px;border-radius:0 10px 10px 0;font-size:14px;margin:16px 0}
.steps{list-style:none;padding:0;margin:8px 0 22px}
.steps li{display:flex;align-items:center;gap:18px;margin:10px 0}
.num-dot{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}
.fnode{background:var(--ink);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13.5px}
.fnode.g{background:var(--g)}
.farrow{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px}
.farrow:after{content:"→";font-size:18px;color:var(--g)}

/* quiz */
.quiz{border:1px dashed var(--gl);border-radius:12px;padding:18px 22px;margin:30px 0 22px}
.quiz-h{font-weight:800;margin-bottom:8px}
.q{margin:14px 0}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--g)}
.opt.right{background:var(--g);border-color:var(--g);color:#fff}
.opt.wrong{background:#fbe9e9;border-color:#d66;color:#a22}
.fb{font-size:13.5px;margin-top:6px;color:var(--gd)}

/* launch */
.launch{background:var(--ink);color:#fff;border-radius:14px;padding:22px 26px;display:flex;gap:20px;align-items:center;justify-content:space-between;margin-top:26px}
.launch h4{margin:4px 0;font-size:18px}
.launch p{margin:0;color:#c3cbc7;font-size:14px}
.btn-launch{background:var(--g);color:#fff;text-decoration:none;font-weight:800;padding:12px 26px;border-radius:30px;white-space:nowrap;font-size:16px;transition:.15s}
.btn-launch:hover{background:var(--gl);color:var(--ink)}
.done-tag{color:var(--gl);font-size:13px;font-weight:700}
.placeholder{color:var(--mut)}

@media (max-width:860px){
  .mod-layout{grid-template-columns:1fr}
  .toc{position:static}
  .lesson{padding:24px 18px}
  .band{margin:30px -18px 20px;padding:20px 18px 16px}
  .split{grid-template-columns:1fr}
  .pcards{grid-template-columns:1fr 1fr}
  .launch{flex-direction:column;align-items:flex-start}
  .hero h1{font-size:30px}
  .ns .nb{right:4px}
}

/* ---------- simulation page ---------- */
.simpage{display:flex;flex-direction:column;height:100vh}
.simbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.sb-back,.sb-btn{background:transparent;color:#fff;border:1px solid #444;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.sb-back:hover,.sb-btn:hover{border-color:var(--gl);color:var(--gl)}
.sb-title{font-weight:700;font-size:15px}
.sb-title .kicker{display:block;font-size:10.5px}
.sb-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.seg{display:flex;border:1px solid #444;border-radius:20px;overflow:hidden}
.seg button{background:none;border:0;color:#ccc;padding:6px 14px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--g);color:#fff}
.simbody{flex:1;display:flex;min-height:0}
.tasks{width:320px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:18px}
.tk-kicker{font-weight:800;color:var(--gd);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.tk-prog{height:6px;background:#e9eeeb;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.tk-prog div{height:100%;background:var(--g);transition:width .3s}
.tk-count{font-size:12.5px;color:var(--mut)}
.tk-intro{font-size:13.5px;color:var(--mut);margin:12px 0}
.tk-list{list-style:none;padding:0;margin:0;font-size:13.5px;line-height:1.5}
.tk-list li{display:flex;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:4px;color:#888}
.tk-list li.cur{background:var(--gp);color:var(--ink);box-shadow:inset 3px 0 0 var(--g)}
.tk-list li.done{color:var(--ink)}
.tk-n{flex:none;width:22px;height:22px;border-radius:50%;background:#eceeed;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#777}
.cur .tk-n{background:var(--g);color:#fff}
.done .tk-n{background:var(--gl);color:var(--gdd)}
.free .tk-list li{color:var(--ink)}
.tk-hint{margin:12px 0;width:100%;background:var(--ink);color:#fff;border:0;border-radius:24px;padding:9px;cursor:pointer;font-weight:700}
.tk-hint:hover{background:var(--g)}
.tk-keys{font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);margin-top:14px;padding-top:12px;line-height:1.7}
.tk-keys kbd{background:#eee;border:1px solid #ccc;border-radius:4px;padding:0 5px;font-size:11.5px}
.tk-alldone{background:var(--g);color:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.desk{flex:1;overflow:auto;background:#d9e1dd;position:relative}
.desk-inner{padding:18px;width:max-content}
@media (max-width:900px){.simbody{flex-direction:column}.tasks{width:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}}

.done-ov{position:absolute;inset:0;background:rgba(11,59,42,.55);display:grid;place-items:center;z-index:200}
.done-card{background:#fff;border-radius:16px;padding:30px 34px;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.done-card .big{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;font-size:32px;display:grid;place-items:center;margin:0 auto 12px}
.done-card h3{margin:0 0 6px;font-size:22px}
.done-card p{color:var(--mut);margin:0 0 18px}
.done-card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:600}
.pill.pri{background:var(--g);color:#fff;border-color:var(--g)}

/* ---------- the simulated application ---------- */
.appwin{width:1180px;height:720px;background:#fff;border:1px solid #8a9690;box-shadow:0 12px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;font:12.5px "Segoe UI",Tahoma,sans-serif;line-height:1.35;color:#000;user-select:none;position:relative}
.w-title{height:28px;display:flex;align-items:center;gap:8px;padding-left:8px;flex:none}
.w-ctl{margin-left:auto;display:flex}
.w-ctl i{font-style:normal;width:44px;text-align:center;line-height:28px;color:#333}
.w-menu{display:flex;height:22px;align-items:center;padding:0 2px;position:relative;z-index:30;flex:none}
.mi{position:relative;padding:2px 7px;cursor:default}
.mi:hover,.mi.open{background:var(--gp)}
.dd{position:absolute;top:100%;left:0;background-color:#f4f4f4;isolation:isolate;border:1px solid #999;box-shadow:2px 3px 8px rgba(0,0,0,.25);min-width:220px;padding:2px 0;z-index:50}
.ddi{padding:3px 24px;white-space:nowrap}
.ddi:hover{background:#cdeedd}
.ddi.dis{color:#a0a0a0}
.ddi.dis:hover{background:none}
.sep{height:1px;background:#ccc;margin:3px 2px}
.w-tools{height:34px;display:flex;align-items:center;gap:10px;padding:0 4px;border-bottom:3px solid var(--g);flex:none}
.tgroup{display:flex;gap:2px}
.tbtn{width:21px;height:21px;border:1px solid #9fb2a9;background:#eef4f1;color:var(--gdd);display:grid;place-items:center;padding:0;cursor:pointer}
.tbtn:hover{background:#d6ede2}
.tbtn.act{outline:2px solid var(--g);outline-offset:1px}
.w-search{flex:1;max-width:680px;display:flex;align-items:center;gap:4px;margin-left:120px;color:#555}
.w-search input{flex:1}
.w-brand{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.06em;padding-right:6px;white-space:nowrap}
.w-brand b{font-weight:800}
.w-work{flex:1;display:flex;min-height:0}
.w-tree{width:300px;flex:none;border-right:5px solid #dadada;overflow:auto}
.w-mdi{flex:1;position:relative;background:#efefef;overflow:hidden}
.w-status{height:22px;border-top:1px solid #ccc;display:grid;grid-template-columns:360px 280px 1fr 120px 175px 85px;font-size:12px;flex:none}
.w-status span{border-left:1px solid #ccc;padding:2px 6px;white-space:nowrap;overflow:hidden;text-align:center}
.tp-filters{display:flex;gap:3px;padding:4px}
.tree-root{background:#dcdcdc;padding:2px 6px;display:flex;gap:6px;align-items:center}
.tree-item{padding:1px 6px 1px 30px;display:flex;align-items:center;gap:6px;cursor:default;white-space:nowrap}
.tree-item:hover{background:var(--gp)}
.tree-item.sel{background:#cdeedd}
.tree-item .ai{color:#0B3B2A;flex:none}
.red-sq{width:12px;height:12px;background:#e01b1b;display:inline-block}

.appwin input,.appwin select,.appwin textarea{font:inherit;border:1px solid #7a7a7a;background:#fff;color:#000;height:21px;padding:0 3px;border-radius:0}
.appwin textarea{height:58px;resize:none;padding:2px 3px}
.appwin input:disabled,.appwin select:disabled,.appwin textarea:disabled{background:#f0f0f0;color:#6d6d6d;border-color:#c4c4c4}
.appwin input[type=radio],.appwin input[type=checkbox]{height:auto;accent-color:var(--g)}
.b95{font:inherit;background:#e1e1e1;border:1px solid #adadad;padding:1px 12px;min-width:76px;cursor:pointer;height:23px;color:#000}
.b95:hover:not(:disabled){background:#e3f3ec;border-color:var(--g)}
.b95:disabled{color:#a3a3a3;background:#ececec;border-color:#d5d5d5;cursor:default}

.nbwin{position:absolute;left:16px;top:8px;width:700px;height:534px;background:#fff;border:1px solid #888;box-shadow:3px 4px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;z-index:5}
.nb-title{height:26px;display:flex;align-items:center;gap:6px;padding-left:8px;font-size:13px;flex:none}
.nb-x{margin-left:auto;border:0;background:none;width:40px;height:26px;cursor:pointer;font-size:14px}
.nb-x:hover{background:#e81123;color:#fff}
.nb-tabs{border-bottom:1px solid #c9c9c9;flex:none;padding-top:2px}
.trow{display:flex;padding:0 2px}
.tab{font:inherit;border:1px solid #c9c9c9;border-bottom:0;background:#f3f3f3;padding:1px 7px;margin-right:-1px;cursor:pointer;color:#000;white-space:nowrap}
.tab:hover{background:#e3f3ec}
.tab.hl{background:var(--g);color:#fff}
.tab.on{background:#fff;font-weight:600;color:#000;box-shadow:inset 0 2px 0 var(--g)}
.nbwin > .w-menu{z-index:40}
.nb-tabs{position:relative;z-index:1}
.nb-body{flex:1;overflow:auto;padding:10px 14px;position:relative;z-index:0;isolation:isolate}
.nb-foot{height:34px;display:flex;align-items:center;gap:10px;padding:0 4px;border-top:1px solid #ddd;flex:none}
.modebtn{font:inherit;font-size:13px;width:222px;height:24px;border:1px solid #999;background:#e1e1e1;cursor:pointer}
.modebtn.upd{background:#cdeedd;border-color:var(--g)}
.nb-kind{color:var(--gdd)}

.gen{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fr{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.fr label{width:72px;text-align:right;color:#000;flex:none}
.g-right .fr label{width:142px}
.fr.ta{align-items:flex-start}
.fr input,.fr textarea{flex:1;min-width:0}
.fr select{flex:1;min-width:0}
.ro{font-weight:600}
.blue,.fr label.blue{color:#1d3f8f}
fieldset.box{border:1px solid #c9c9c9;margin:6px 0 10px;padding:4px 8px 8px}
fieldset.box legend{padding:0 4px}
.al{display:flex;gap:8px}
.al .grid{flex:1;height:78px}
.al-btns{display:flex;flex-direction:column;gap:5px}
.codes .cr{display:flex;gap:6px;margin-bottom:5px;align-items:center}
.codes .b95{width:112px;white-space:nowrap;padding:1px 6px}
.chk{display:flex;align-items:center;gap:5px}
.grid{border:1px solid #828790;background:#fff;overflow:auto}
.gh{display:grid;background:#fff;border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:1}
.gh span{padding:2px 6px;border-right:1px solid #e5e5e5}
.gr{display:grid;cursor:default}
.gr span{padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr:hover{background:var(--gp)}
.gr.sel{background:#d7efe3;box-shadow:inset 0 0 0 2px var(--g)}
.gr.loc span{color:#1d3f8f}
.ph-row{display:flex;gap:40px;align-items:center;margin-bottom:6px}
.red{color:#d21d1d}
.grn{color:#178a2f}
.tall{height:260px}
.btnrow{display:flex;gap:6px;margin-top:10px}
.pbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;margin-top:10px}
.pbtns .b95{min-width:0;width:100%}
.ph-tab{color:#555;padding:30px 10px;text-align:center}
.ph-tab b{display:block;color:#000;font-size:14px;margin-bottom:6px}

/* multi-window engine */
.xwin{position:absolute;background:#fff;border:1px solid #8a8a8a;box-shadow:3px 4px 14px rgba(0,0,0,.22);display:flex;flex-direction:column}
.xwin.front{border-color:var(--gd);box-shadow:5px 8px 22px rgba(0,0,0,.32)}
.xwin:not(.front) .nb-title{color:#777}
.xwin > .w-menu{z-index:40}
.xwin .tab{padding:1px 4px;font-size:12px}
.nb-title[data-drag]{cursor:move;flex:none}
.xbody{flex:1;overflow:auto;padding:8px 12px;position:relative;z-index:0;isolation:isolate}
.xbody .fr label{width:122px;text-align:right}
.b95.lb{width:100%;min-width:0;padding:1px 4px;white-space:nowrap}
.amt{text-align:right;font-variant-numeric:tabular-nums}
.fr > span.amt{width:130px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center}
.kv > label{text-align:right;color:#1d3f8f;white-space:nowrap}
.ro-in{display:inline-block;border:1px solid #c4c4c4;background:#f0f0f0;padding:0 4px;height:21px;line-height:19px;color:#333}
.blue-list .gr span{color:#1d3f8f}
.btn-grid{display:grid;gap:5px 14px;margin-top:10px}
.btn-grid .b95{min-width:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts-grid{display:grid;grid-template-columns:auto auto auto;gap:5px 14px;align-items:center;margin:6px 0}
.opts-grid .fr{margin:0}
.os-box{border:1px solid #c9c9c9;background:#fff;padding:3px 10px;display:flex;flex-direction:column;gap:2px}
.ctx{position:absolute;z-index:500;background:#f4f4f4;border:1px solid #999;box-shadow:2px 3px 8px rgba(0,0,0,.25);padding:2px 0;min-width:180px}
.dd{max-height:500px;overflow-y:auto}

.shade{position:absolute;inset:0;background:rgba(255,255,255,.12);z-index:300}
.dlg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:#f6f6f6;border:1px solid #777;box-shadow:4px 6px 18px rgba(0,0,0,.3);z-index:301;min-width:320px}
.dlg-t{height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#fff;border-bottom:1px solid #ddd}
.dlg-b{padding:14px 18px}
.dlg-btns{display:flex;gap:10px;justify-content:center;margin-top:18px}
.cs-radio{display:flex;gap:16px;justify-content:center;border:1px solid #ccc;background:#fff;width:176px;margin:0 auto 26px;padding:1px 6px}
.cs-radio label{display:flex;gap:4px;align-items:center}
.cs-row{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:18px}
.cs-row input{width:266px}
.cs-row select{width:104px}
.wrn{display:flex;gap:14px}
.wicon{width:28px;height:28px;border-radius:50%;background:var(--amber);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:16px}
.wt{border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:6px}
.wrn p{margin:6px 0}
.cl-search{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ap-list label{display:flex;gap:6px;align-items:center;padding:3px 0}
.ap-list label.dis{color:#999}
.fm .fr label{width:90px}

.pulse{animation:pulse 1.1s ease-in-out infinite;position:relative;z-index:60}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--amber),0 0 0 6px rgba(245,180,0,.45)}50%{box-shadow:0 0 0 2px var(--amber),0 0 0 13px rgba(245,180,0,0)}}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;max-width:min(560px,92vw);opacity:0;pointer-events:none;transition:.25s;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:4px solid var(--g)}
#toast.show{opacity:1;transform:translate(-50%,0)}

// Default logo (generic green leaf). If logo.png sits next to this HTML file, it replaces it everywhere (see loadLogo).
let LOGO = `<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#00915A"/><path d="M9 23c0-8 6-14 15-14-1 9-6 15-14 15" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M9 24l7-7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
let LOGO_SM = LOGO.replace('width="28" height="28"','width="14" height="14"');

function loadLogo() {
  const img = new Image();
  img.onload = () => {
    const tag = size => `<img src="logo.png" alt="" width="${size}" height="${size}" style="object-fit:contain;flex:none;display:inline-block;vertical-align:middle">`;
    LOGO = tag(28);
    LOGO_SM = tag(14);
    const icon = document.createElement('link');
    icon.rel = 'icon'; icon.href = 'logo.png';
    document.head.appendChild(icon);
    if (VIEW === 'sim') renderSim(); else route(); // redraw with the logo, without restarting a running simulation
  };
  img.src = 'logo.png'; // if missing, onload never fires and the default leaf stays
}

/* ---------------- helpers ---------------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let VIEW = 'home';
let S = null;

const LS_KEY = 'bnppsim-progress';
function loadProg() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } }
function saveProg(p) { try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch (e) {} }

function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 4000);
}

function topbar(crumbs) {
  return `<header class="top"><div class="wrap top-in">
    <a href="#/" class="brand">${LOGO}<span><b>BNPP</b> Simulator</span></a>
    <nav class="crumbs">${crumbs.map((c, i) => (i ? '<span>›</span>' : '') + (c.h ? `<a href="${c.h}">${esc(c.t)}</a>` : `<span>${esc(c.t)}</span>`)).join('')}</nav>
  </div></header>`;
}

  return `<section class="lesson" id="sec-${s.id}">

      <div class="q"><p>${qi + 1}. ${q.q}</p><div class="opts">${q.o.map((o, oi) => `<button class="opt" data-a="answer" data-v="${m.id}|${s.id}|${qi}|${oi}">${esc(o)}</button>`).join('')}</div><div class="fb"></div></div>`).join('')}</div>` : ''}

const PAGE_ACTIONS = {
  openModule: v => { location.hash = '#/module/' + v; },
  goto: v => { const el = document.getElementById('sec-' + v); if (el) el.scrollIntoView({ behavior: 'smooth' }); },
  answer: (v, t) => {
    const [mid, sid, qi, oi] = v.split('|');
    const q = MODULES.find(m => m.id === mid).sections.find(s => s.id === sid).quiz[qi];
    const box = t.closest('.q');
    box.querySelectorAll('.opt').forEach(b => b.classList.remove('wrong'));
    if (+oi === q.a) { t.classList.add('right'); box.querySelector('.fb').textContent = '✓ Correct. ' + (q.why || ''); }
    else { t.classList.add('wrong'); box.querySelector('.fb').textContent = '✗ Not quite. Try again.'; }
  },
};

function startSim(id, guided = true) {
  if (!SIMS[id]) { location.hash = '#/'; return; }
  VIEW = 'sim';
  S = {
    simId: id, guided, left: 'favorites', selAction: null, menu: null, dialog: null,
    cs: { mode: 'Existing', by: 'Short Name', text: '%' }, listSel: null, listTerm: '%',
    nb: null, flags: {}, step: 0, hintOn: false, done: false, doneDismissed: false,
    customers: baseCustomers(SIMS[id].module === 'm2'), form: null, apSel: null, focus: null,
    wins: [], wid: 0, ctx: null, ds: null, os: null, dlSel: null, dealTerm: '%', warnNext: 'custList', hintJust: false,
    date: SIMS[id].date || '03-Jul-2013', selFav: null, bank: null, addRIType: 'Standard', addRIFor: null, riSeq: 0,
  };
  renderSim();
}

function cur() { return S.nb && S.customers.find(c => c.id === S.nb.cid); }

function advance() {
  const steps = SIMS[S.simId].steps;
  if (S.guided) {
    const before = S.step;
    while (S.step < steps.length && steps[S.step].check(S)) S.step++;
    if (S.step !== before) S.hintOn = false;
    if (S.step === steps.length && !S.done) { S.done = true; markDone(); }
  } else if (!S.done && steps.every(st => st.check(S))) { S.done = true; markDone(); }
}
function markDone() { const sim = SIMS[S.simId]; const p = loadProg(); p[sim.module + '/' + sim.section] = true; saveProg(p); }
function update() { advance(); renderSim(); }

// The screen is redrawn after every click, so scroll positions are saved and put back.
// Any element with data-keep-scroll="<key>" keeps its scroll position between redraws.
function saveScroll() {
  const m = {};
  document.querySelectorAll('[data-keep-scroll]').forEach(el => { m[el.dataset.keepScroll] = [el.scrollTop, el.scrollLeft]; });
  return m;
}
function restoreScroll(m) {
  document.querySelectorAll('[data-keep-scroll]').forEach(el => { const v = m[el.dataset.keepScroll]; if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; } });
}
// when a guided step is completed, bring the new current step into view inside the task panel only
function showCurrentStep() {
  const panel = document.querySelector('.tasks'), li = panel && panel.querySelector('.tk-list li.cur');
  if (!li) return;
  const p = panel.getBoundingClientRect(), r = li.getBoundingClientRect();
  if (r.top < p.top) panel.scrollTop -= p.top - r.top + 12;
  else if (r.bottom > p.bottom) panel.scrollTop += r.bottom - p.bottom + 12;
}

function renderSim() {
  const sim = SIMS[S.simId];
  const scroll = saveScroll();
  app.innerHTML = `<div class="simpage">
    <div class="simbar">
      <button class="sb-back" data-a="back">← Back to module</button>
      <div class="sb-title"><span class="kicker">Simulation</span>${esc(sim.title)}</div>
      <div class="sb-right">
        <div class="seg"><button class="${S.guided ? 'on' : ''}" data-a="setGuided" data-v="1">Guided</button><button class="${!S.guided ? 'on' : ''}" data-a="setGuided" data-v="0">Free practice</button></div>
        <button class="sb-btn" data-a="restart">↺ Restart</button>
      </div>
    </div>
    <div class="simbody">
      ${tasksPanel()}
      <div class="desk" data-keep-scroll="desk"><div class="desk-inner">${appWindow()}</div>
        ${S.done && S.guided && !S.doneDismissed ? `<div class="done-ov"><div class="done-card">
          <div class="big">✓</div><h3>Simulation complete</h3>
          <p>You completed all ${sim.steps.length} steps. Well done!</p>
          <div class="row"><button class="pill pri" data-a="back">Back to module</button><button class="pill" data-a="dismissDone">Keep exploring</button><button class="pill" data-a="restart">Restart</button></div>
        </div></div>` : ''}
      </div>
    </div>
  </div>`;
  restoreScroll(scroll);
  if (S.lastStep !== S.step) { S.lastStep = S.step; showCurrentStep(); }
  if (S.hintOn && S.guided) {
    const st = sim.steps[S.step];
    if (st) {
      const sel = typeof st.hint === 'function' ? st.hint(S) : st.hint;
      const el = sel && document.querySelector(sel);
      if (el) { el.classList.add('pulse'); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
      else if (S.hintJust) toast(st.tip || 'Follow the instruction of the highlighted step.');
    }
  }
  S.hintJust = false;
  if (S.focus) { const el = document.querySelector(S.focus); if (el) { el.focus(); if (el.select) el.select(); } S.focus = null; }
}

function tasksPanel() {
  const sim = SIMS[S.simId], steps = sim.steps;
  const doneArr = steps.map((st, i) => S.guided ? i < S.step : st.check(S));
  const n = doneArr.filter(Boolean).length;
  return `<aside class="tasks ${S.guided ? '' : 'free'}" data-keep-scroll="tasks">
    <div class="tk-kicker">${S.guided ? 'Guided practice' : 'Free practice'}</div>
    <div class="tk-prog"><div style="width:${Math.round(n / steps.length * 100)}%"></div></div>
    <div class="tk-count">${n} / ${steps.length} steps</div>
    <p class="tk-intro">${S.guided ? sim.intro : 'Explore the screen freely. Goals tick off when you reach them, in any order.'}</p>
    ${S.done ? '<div class="tk-alldone">✓ All steps completed</div>' : ''}
    <ol class="tk-list">${steps.map((st, i) => `<li class="${doneArr[i] ? 'done' : ''} ${S.guided && i === S.step ? 'cur' : ''}"><span class="tk-n">${doneArr[i] ? '✓' : i + 1}</span><span>${st.t}</span></li>`).join('')}</ol>
    ${S.guided && S.step < steps.length ? '<button class="tk-hint" data-a="hint">💡 Show me where</button>' : ''}
    <div class="tk-keys"><b>Shortcuts</b><br><kbd>F7</kbd> toggles Inquiry / Update mode<br>Double-click opens an item<br><kbd>Esc</kbd> closes a menu or dialog</div>
  </aside>`;
}

/* =====================================================================
   MULTI-WINDOW ENGINE (Lesson 3+)
   Each open window is an object in S.wins ({id, type, x, y, w, h, tab, menu, update, ...}).
   The last item of S.wins is the front (active) window. WIN[type] describes how to draw it.
   ===================================================================== */
const getWin = id => S.wins.find(w => w.id === +id);
const topWin = () => S.wins[S.wins.length - 1];
const splitV = v => { const i = v.indexOf('|'); return [+v.slice(0, i), v.slice(i + 1)]; };
function focusWin(id) {
  const i = S.wins.findIndex(w => w.id === id);
  if (i < 0 || i === S.wins.length - 1) return false;
  S.wins.push(S.wins.splice(i, 1)[0]);
  return true;
}
function openWin(type, props = {}) {
  const ex = S.wins.find(w => w.type === type && w.key === props.key); // key = several windows of one type (e.g. one RI per window)
  if (ex) { focusWin(ex.id); return ex; }
  const d = WIN[type];
  const w = { id: ++S.wid, type, x: d.x, y: d.y, w: d.w, h: d.h, tab: d.tab || null, menu: null, update: false, ...props };
  S.wins.push(w);
  return w;
}
function closeWin(id) { const w = getWin(id); if (!w) return; S.wins = S.wins.filter(x => x !== w); S.flags['closed_' + w.type] = true; }
function toggleWinMode(w) {

    : !ri.ccy ? 'Select a <b>Currency</b>.'

  ri.saved = true;

  const ri = w.ri;

  else if (ri.status === 'Awaiting Release') { ri.status = 'Released'; toast('Remittance instruction <b>released</b>.'); }

}

// text/checkbox/select fields of the RI notebook write straight into the RI object
function riField(t) {
  const [id, k] = splitV(t.dataset.rif), w = getWin(id);
  if (!w) return;
  const val = t.type === 'checkbox' ? t.checked : t.value;
  if (w.ri[k] === val) return;
  w.ri[k] = val;
  if (k === 'method') {
    if (val === 'Federal Reserve') { if (!w.ri.desc) w.ri.desc = 'FED2'; if (!w.ri.ccy) w.ri.ccy = 'USD'; }
    update();
  } else refreshTasks();
}
// re-checks the steps and redraws only the task panel (keeps the cursor in the field being typed in)
function refreshTasks() {
  advance();
  if (S.done && S.guided && !S.doneDismissed) { renderSim(); return; }
  const el = document.querySelector('.tasks');
  if (!el) return;
  const top = el.scrollTop;
  el.outerHTML = tasksPanel();
  document.querySelector('.tasks').scrollTop = top;
  if (S.lastStep !== S.step) { S.lastStep = S.step; showCurrentStep(); }
}

function winAction(w, t) {
  if (WIN[w.type].action && WIN[w.type].action(w, t) !== false) return; // window-specific behavior first
  switch (t) {
    case 'Exit': closeWin(w.id); return;
    case 'Update': case 'Inquiry': toggleWinMode(w); return;
    case 'Save': toast('Changes saved.'); return;
    case 'Open': openDealSelect(); return;
    case 'Lender Query...': openWin('lq'); S.flags.lq = true; return;
    case 'Facilities...': openWin('facNav'); S.flags.facNav = true; return;
    case 'Facility:': openFacility(); return;
    case 'Outstanding Select...': case 'Outstandings...': case 'Outstandings:': case 'Outstandings (Funded):': openOutSelect(); return;
    case 'Expand All': w.exp = true; return;
    case 'Collapse All': w.exp = false; return;
    case 'Refresh': toast('Refreshed.'); return;
  }
  notSimulated(t.replace(/[.:]+$/, ''));
}

function openDealSelect() { S.dialog = 'dealSelect'; S.flags.dealSelect = true; S.ds = { mode: 'Existing', status: 'Active', by: 'Name', text: '%' }; S.dlSel = null; S.focus = '[data-sim="ds-text"]'; }
function matchDeals(term) {
  if (S.ds.status === 'Inactive') return [];
  const f = S.ds.by === 'Alias' ? 'alias' : 'name';
  const rx = term.includes('%') ? new RegExp('^' + term.split('%').map(escRx).join('.*') + '$', 'i') : new RegExp('^' + escRx(term), 'i');
  return DEALS.filter(d => rx.test(d[f]));
}
function dealSearch(isOk) {
  if (S.ds.mode !== 'Existing') { toast('Select <b>Existing</b> to open a deal.'); return; }
  const term = S.ds.text.trim();
  if (!term) { toast('Enter a value to search for.'); return; }
  S.flags.dealSearched = true; S.dealTerm = term;
  const list = matchDeals(term);
  if (isOk) {
    const f = S.ds.by === 'Alias' ? 'alias' : 'name';
    const ex = list.find(d => d[f].toUpperCase() === term.toUpperCase());
    if (ex) { openDeal(ex.name); return; }
  }
  if (term.replace(/%/g, '').length < 2) { S.warnNext = 'dealList'; S.dialog = 'warning'; return; }
  if (!list.length) { toast(`No deal matches “${esc(term)}”.`); return; }
  S.dialog = 'dealList'; S.dlSel = null;
}
function openDeal(name) {
  if (name !== 'BIL DEAL') { toast('Only <b>BIL DEAL</b> is set up in this simulation. Please select BIL DEAL.'); return; }
  S.dialog = null; openWin('deal');
}
function openFacility() { openWin('facility'); S.flags.facility = true; }
function openOutSelect() { S.os = { mode: 'Existing', active: true, inactive: false, pending: false, type: 'Loan', by: 'Deal/Facility' }; S.dialog = 'outSelect'; }
function outSearch() {
  const o = S.os;
  if (o.mode !== 'Existing') { toast('Select <b>Existing</b> to find existing outstandings.'); return; }
  if (!o.active || !['Loan', 'ALL'].includes(o.type)) { toast('No matching outstandings found for BIL DEAL/REVOLVER. Try Type <b>Loan</b> with <b>Active</b> checked.'); return; }
  S.dialog = null; openWin('loans', { remain: true, openUpd: false }); S.flags.loansWin = true;
}

/* ---------- logic ---------- */
function fieldOf(c) { return S.cs.by === 'Customer ID' ? c.id : S.cs.by === 'Legal Name' ? c.legal : c.short; }
function matchCustomers(term) {
  const rx = term.includes('%') ? new RegExp('^' + term.split('%').map(escRx).join('.*') + '$', 'i') : new RegExp('^' + escRx(term), 'i');
  return S.customers.filter(c => rx.test(fieldOf(c))).sort((a, b) => fieldOf(a).localeCompare(fieldOf(b)));
}
function openCustSelect() { S.dialog = 'custSelect'; S.flags.custSelect = true; S.cs = { mode: 'Existing', by: 'Short Name', text: '%' }; S.focus = '[data-sim="cs-text"]'; }
function doSearch(isOk) {
  if (S.cs.mode === 'New') { toast('Creating a new customer is covered in a later lesson. Select <b>Existing</b>.'); return; }
  const term = S.cs.text.trim();
  if (!term) { toast('Enter a value to search for.'); return; }
  S.flags.searched = true;
  S.listTerm = term;
  if (isOk) {
    const exact = S.customers.filter(c => fieldOf(c).toUpperCase() === term.toUpperCase());
    if (exact.length === 1) { openNotebook(exact[0].id); return; }
  }
  if (term.replace(/%/g, '').length < 2) { S.warnNext = 'custList'; S.dialog = 'warning'; return; }
  if (!matchCustomers(term).length) { toast(`No customer matches “${esc(term)}”.`); return; }
  S.dialog = 'custList'; S.listSel = null;
}
function openNotebook(id) { S.nb = { cid: id, tab: 'General', update: false, menu: null, sel: null, dirty: false, aliasSel: null, persSel: null }; S.dialog = null; }
function toggleMode() {
  if (!S.nb || S.dialog) return;
  S.nb.update = !S.nb.update;
  toast(S.nb.update ? 'Notebook is now in <b>Update mode</b>. You can enter or modify data.' : 'Notebook is back in <b>Inquiry mode</b> (view only).');
}
function closeNb() { S.nb = null; S.dialog = null; S.flags.nbExit = true; }
function tryExit() { if (S.nb.dirty) S.dialog = 'exitConfirm'; else closeNb(); }
function openForm(title, fields, ok) {
  const vals = {}; fields.forEach(f => vals[f.k] = f.opts ? f.opts[0] : '');
  S.form = { title, fields, vals, ok }; S.dialog = 'form';
  const txt = fields.find(f => !f.opts); if (txt) S.focus = `[data-sim="form-${txt.k}"]`;
}
const notSimulated = v => toast(`“${esc(v)}” opens another window in the real application. It is not simulated here.`);

const SIM_ACTIONS = {
  noop() {},
  back() { const sim = SIMS[S.simId]; location.hash = `#/module/${sim.module}/${sim.section}`; },
  restart() { const g = S.guided; startSim(S.simId, g); },
  setGuided(v) { S.guided = v === '1'; S.hintOn = false; S.doneDismissed = true; },
  hint() { S.hintOn = true; S.hintJust = true; },
  dismissDone() { S.doneDismissed = true; },
  menu(v) { S.menu = S.menu === v ? null : v; },
  item(v) { if (v === 'Exit') toast('This is a training simulator. Use “Back to module” to leave.'); else notSimulated(v); },
  tbActions() { S.left = 'actions'; },
  tbHome() { S.left = 'favorites'; },
  tbOpen() { toast('Tip: open notebooks from the <b>Actions</b> panel (house button).'); },
  tbTree() { notSimulated('Tree view'); },
  tbHist() { notSimulated('History'); },
  tbNo() { toast('This tool is not part of this simulation.'); },
  selAction(v) { S.selAction = v; },
  csMode(v) { S.cs.mode = v; if (v === 'New') toast('Creating a new customer is covered in a later lesson.'); },
  csSearch() { doSearch(false); },
  csOk() { doSearch(true); },
  csCancel() { S.dialog = null; },
  csFilter() { toast('Status Filter lets you limit the search to Active, Inactive or Prospect customers.'); },
  warnYes() {
    S.flags.warnYes = true;
    if (S.warnNext === 'dealList') { S.dialog = 'dealList'; S.dlSel = null; } else { S.dialog = 'custList'; S.listSel = null; }
  },
  warnNo() { S.dialog = S.warnNext === 'dealList' ? 'dealSelect' : 'custSelect'; },
  listSel(v) { S.listSel = v; },
  clOk() { if (!S.listSel) { toast('Select a customer first.'); return; } openNotebook(S.listSel); },
  clCancel() { S.dialog = 'custSelect'; },
  nbmenu(v) {
    if (v === 'Instant Message') { notSimulated('Instant Message'); return; }
    S.nb.menu = S.nb.menu === v ? null : v;
    if (S.nb.menu) S.flags['nbmenu_' + v] = true;
  },
  nbitem(v) {
    if (v === 'Update' || v === 'Inquiry') toggleMode();
    else if (v === 'Save') { S.flags.saved = true; S.nb.dirty = false; toast(`Customer <b>${esc(cur().short)}</b> saved.`); }
    else if (v === 'Exit') tryExit();
    else if (v === 'Open') openCustSelect();
    else if (v === 'Drop in Folder') toast('Notebook added to your Favorites folder.');
    else notSimulated(v);
  },
  nbclose() { tryExit(); },
  tab(v) { S.nb.tab = v; S.nb.sel = null; },
  toggleMode() { toggleMode(); },
  lookup(v) { toast(`The <b>${esc(v)}</b> button opens a lookup list to choose a value.`); },
  aliasSel(v) { S.nb.aliasSel = +v; },
  aliasAdd() {
    openForm('Add Alias', [{ k: 'type', label: 'Alias Type', opts: ['Former Name', 'Trading Name', 'SWIFT ID'] }, { k: 'name', label: 'Alias Name' }], vals => {

    });
  },
  aliasDel() { cur().aliases.splice(S.nb.aliasSel, 1); S.nb.aliasSel = null; S.nb.dirty = true; },
  persSel(v) { S.nb.persSel = +v; },
  persAdd() {
    openForm('Add Personnel', [{ k: 'user', label: 'User Name', opts: ['DAM1 *', 'JSMITH', 'AMARTIN'] }, { k: 'role', label: 'Role', opts: ['Relationship Manager', 'Credit Officer', 'Servicing Officer'] }, { k: 'access', label: 'Access Level', opts: ['Full', 'Read Only'] }], vals => {
      cur().personnel.push(vals); S.nb.dirty = true;
    });
  },
  persDel() { cur().personnel.splice(S.nb.persSel, 1); S.nb.persSel = null; S.nb.dirty = true; },
  persUser() { toast(S.nb.persSel == null ? 'Select a user first, then click <b>User</b> to drill down.' : 'Shows the details of the selected user.'); },
  profSel(v) { S.nb.sel = v; },
  addProfile() { S.dialog = 'addProfile'; S.apSel = null; },
  apSel(v) { S.apSel = v; },
  apOk() {
    if (!S.apSel) { toast('Choose a profile type.'); return; }
    const c = cur(); c.profiles.push({ type: S.apSel, status: 'Not In Use', locs: [] });
    S.nb.sel = String(c.profiles.length - 1); S.nb.dirty = true; S.dialog = null;
    toast(`<b>${S.apSel}</b> profile added. Now add a location to it.`);
  },
  addLoc() {
    const pi = +S.nb.sel.split('-')[0], p = cur().profiles[pi];
    openForm('Add Location: ' + p.type, [{ k: 'loc', label: 'Location', opts: LOCATIONS }], vals => {
      if (p.locs.some(l => l.name === vals.loc)) { toast('This location already exists for the profile.'); return; }
      p.locs.push({ name: vals.loc, status: 'Incomplete' });
      S.nb.sel = `${pi}-${p.locs.length - 1}`; S.nb.dirty = true;
    });
  },
  profDel() {
    const [pi, li] = S.nb.sel.split('-'), p = cur().profiles[+pi];
    if (li != null) { p.locs.splice(+li, 1); }
    else if (p.status === 'In Use') { toast('A profile that is <b>In Use</b> cannot be deleted.'); return; }
    else cur().profiles.splice(+pi, 1);
    S.nb.sel = null; S.nb.dirty = true;
  },
  completeLoc() {
    const [pi, li] = S.nb.sel.split('-');
    cur().profiles[+pi].locs[+li].status = 'Complete'; S.nb.dirty = true;
    toast('Location completed. In the real application, you also enter its addresses, contacts and remittance instructions.');
  },
  locBtn(v) { if (v === 'Remittance Instructions') openRIList(); else notSimulated(v); },
  // ----- remittance instructions (Module 2) -----
  selFav(v) { S.selFav = v; },
  ariType(v) { S.addRIType = v; },
  ariOk() {
    if (S.addRIType !== 'Standard') { toast('Simplified IMT remittance instructions are not part of this exercise. Choose <b>Standard</b>.'); return; }
    const lw = getWin(S.addRIFor);
    if (!lw) { S.dialog = null; return; }
    const ri = { id: ++S.riSeq, method: '', desc: '', aba: '', bank: '', b2b: '', allLoan: true, sblc: true, dirFrom: false, dirTo: true, balP: true, balI: true, balF: true, ccy: '', acct: '', benType: '', info: '', autoDoIt: false, status: 'Pending', saved: false };
    lw.loc.ris.push(ri);
    S.dialog = null;
    openWin('riDetail', { key: 'ri' + ri.id, ri, loc: lw.loc, update: true });
    S.flags.riDetail = true;
  },
  riSel(v) { const [id, i] = splitV(v), w = getWin(id); if (w) w.sel = +i; },
  wfSel(v) { const w = getWin(v); if (w) w.wfSel = true; },
  sbBy(v) { S.bank.by = v; S.bank.q = ''; },
  sbSel(v) { S.bank.sel = v; },
  sbOk() { pickBank(); },
  formOk() {
    const f = S.form, missing = f.fields.find(x => !String(f.vals[x.k]).trim());
    if (missing) { toast(`Enter a value for <b>${esc(missing.label)}</b>.`); return; }
    S.dialog = null; f.ok(f.vals);
  },
  closeDlg() { S.dialog = null; },
  exitYes() { S.flags.saved = true; closeNb(); },
  exitNo() { closeNb(); },
  // ----- deal / multi-window (Lesson 3) -----
  dsMode(v) { S.ds.mode = v; if (v !== 'Existing') toast('Creating deals is not part of this lesson. Keep <b>Existing</b>.'); },
  dsStatus(v) { S.ds.status = v; },
  dsSearch() { dealSearch(false); },
  dsOk() { dealSearch(true); },
  dlSel(v) { S.dlSel = v; },
  dlOk() { if (!S.dlSel) { toast('Select a deal first.'); return; } openDeal(S.dlSel); },
  dlCancel() { S.dialog = 'dealSelect'; },
  wmenu(v) {
    const [id, n] = splitV(v), w = getWin(id);
    if (!w) return;
    if (!WIN[w.type].frame(w).menus[n]) { w.menu = null; notSimulated(n); return; }
    w.menu = w.menu === n ? null : n;
  },
  witem(v) { const [id, t] = splitV(v), w = getWin(id); if (!w) return; w.menu = null; winAction(w, t); },
  wtab(v) { const [id, t] = splitV(v), w = getWin(id); if (!w) return; w.tab = t; S.flags[`tab_${w.type}_${t}`] = true; },
  wmode(v) { toggleWinMode(getWin(v)); },
  wclose(v) { closeWin(v); },
  wbtn(v) { const [id, t] = splitV(v), w = getWin(id); if (w) winAction(w, t); },
  lqToggle(v) { const w = getWin(v); if (w) w.exp = !w.exp; },
  facSel(v) { const w = getWin(v); if (w) w.sel = true; },
  loanSel(v) { const w = getWin(v); if (w) w.sel = true; },
  loansOpt(v) { const [id, k] = splitV(v), w = getWin(id); if (w) w[k] = !w[k]; },
  osMode(v) { S.os.mode = v; },
  osChk(v) { S.os[v] = !S.os[v]; },
  osSearch() { outSearch(); },
  ctx(v) {
    S.ctx = null;
    if (v === 'Close All Windows') closeAll();
    else if (v === 'Window List') {
      const t = [...(S.nb ? ['Active Customer -- ' + cur().short] : []), ...S.wins.map(w => WIN[w.type].title(w))];
      toast(t.length ? '<b>Open windows:</b><br>' + t.map(esc).join('<br>') : 'No windows are open.');
    } else if (v === 'About BNPP Simulator') toast('<b>BNPP Simulator</b>: training environment.');
    else notSimulated(v);
  },
};
const SIM_DBL = {
  openAction(v) {
    if (v === 'Customer') openCustSelect();
    else if (v === 'Deal') openDealSelect();
    else toast(`<b>${esc(v)}</b> is not part of this module's simulation.`);
  },
  listOpen(v) { openNotebook(v); },
  dlOpen(v) { openDeal(v); },
  openFav(v) {
    if (v === 'SMITH CORPORATION') openNotebook(SMITH_ID);
    else toast(`<b>${esc(v)}</b> is not part of this exercise.`);
  },
  riOpen(v) {
    const [id, i] = splitV(v), lw = getWin(id), ri = lw && lw.loc.ris[+i];
    if (ri) openWin('riDetail', { key: 'ri' + ri.id, ri, loc: lw.loc, update: lw.update });
  },
  wfDo(v) { const w = getWin(v); if (w) wfDo(w); },
  sbOpen(v) { S.bank.sel = v; pickBank(); },
  facOpen() { openFacility(); },
  loanOpen(v) {
    const lw = getWin(v);
    openWin('loan', { update: !!(lw && lw.openUpd) });
    S.flags.loan = true;
    if (lw && !lw.remain) closeWin(lw.id);
  },
};

/* ---------- events ---------- */
let lastClick = { key: null, t: 0 };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (VIEW !== 'sim') {
    if (t && PAGE_ACTIONS[t.dataset.a]) PAGE_ACTIONS[t.dataset.a](t.dataset.v, t, e);
    return;
  }
  const a = t && t.dataset.a;
  const hadMenu = S.menu || (S.nb && S.nb.menu) || S.ctx || S.wins.some(w => w.menu);
  if (a !== 'menu') S.menu = null;
  if (a !== 'nbmenu' && S.nb) S.nb.menu = null;
  if (a !== 'ctx') S.ctx = null;
  const keepW = a === 'wmenu' ? +t.dataset.v.split('|')[0] : null;
  S.wins.forEach(w => { if (w.id !== keepW) w.menu = null; });
  // clicking anywhere on a window brings it to the front
  const wEl = e.target.closest('[data-win]');
  const moved = wEl ? focusWin(+wEl.dataset.win) : false;
  if (!t) { if (hadMenu || moved) update(); return; }
  if (SIM_ACTIONS[a]) SIM_ACTIONS[a](t.dataset.v, t, e);
  // double-click detection (done manually because the screen re-renders between clicks)
  if (t.dataset.d) {
    const key = t.dataset.d + '|' + t.dataset.v, now = Date.now();
    if (lastClick.key === key && now - lastClick.t < 450) { SIM_DBL[t.dataset.d](t.dataset.v); lastClick = { key: null, t: 0 }; }
    else lastClick = { key, t: now };
  }
  if (VIEW === 'sim') update();
});

function setBind(path, val) {
  const [root, k] = path.split('.');
  if (root === 'form') { if (S.form) S.form.vals[k] = val; }
  else if (S[root] && typeof S[root] === 'object') S[root][k] = val; // cs, ds, os
}
document.addEventListener('input', e => {
  if (VIEW !== 'sim') return;
  const t = e.target;
  if (t.dataset.rif) { riField(t); return; }
  if (t.dataset.bind) {
    setBind(t.dataset.bind, t.value);
    if (t.dataset.live) { // live filter: redraw, then put the cursor back at the end of the field
      const b = t.dataset.bind, pos = t.value.length;
      update();
      const el = document.querySelector(`[data-bind="${b}"]`);
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    }
  }
});
document.addEventListener('change', e => {
  if (VIEW !== 'sim') return;
  const t = e.target;
  if (t.dataset.rif) { riField(t); return; }
  if (t.dataset.bind) setBind(t.dataset.bind, t.value);
  if (t.dataset.f && S.nb) {
    cur()[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
    S.nb.dirty = true;
    if (t.dataset.f === 'short') update();
  }
});
document.addEventListener('keydown', e => {
  if (VIEW !== 'sim') return;
  if (e.key === 'F7') {
    e.preventDefault();
    if (!S.dialog) {
      const w = topWin(); // F7 acts on the front window
      if (w) toggleWinMode(w); else if (S.nb) toggleMode();
      update();
    }
  } else if (e.key === 'Escape') {
    if (S.ctx || S.menu || (S.nb && S.nb.menu) || S.wins.some(w => w.menu)) { S.ctx = null; S.menu = null; if (S.nb) S.nb.menu = null; S.wins.forEach(w => { w.menu = null; }); }
    else if (S.dialog === 'warning') S.dialog = S.warnNext === 'dealList' ? 'dealSelect' : 'custSelect';
    else if (S.dialog === 'custList') S.dialog = 'custSelect';
    else if (S.dialog === 'dealList') S.dialog = 'dealSelect';
    else if (S.dialog) S.dialog = null;
    update();
  } else if (e.key === 'Enter') {
    const b = e.target.dataset && e.target.dataset.bind;
    if (b === 'cs.text') { e.preventDefault(); doSearch(false); update(); }
    else if (b === 'ds.text') { e.preventDefault(); dealSearch(false); update(); }
    else if (e.target.dataset.rif && e.target.tagName === 'INPUT') { e.preventDefault(); riField(e.target); update(); }
    else if (b && b.startsWith('form.')) { e.preventDefault(); SIM_ACTIONS.formOk(); update(); }
    else if (b === 'search') toast('Global search is not simulated. Use the <b>Actions</b> panel.');
  }
});

// right-click in the workspace opens the context menu (About, Close All Windows, ...)
document.addEventListener('contextmenu', e => {
  if (VIEW !== 'sim') return;
  const mdi = e.target.closest('.w-mdi');
  if (!mdi) return;
  e.preventDefault();
  const r = mdi.getBoundingClientRect();
  S.ctx = { x: Math.max(0, Math.min(e.clientX - r.left, r.width - 190)), y: Math.max(0, Math.min(e.clientY - r.top, r.height - 220)) };
  S.menu = null; if (S.nb) S.nb.menu = null; S.wins.forEach(w => { w.menu = null; });
  const wEl = e.target.closest('[data-win]');
  if (wEl) focusWin(+wEl.dataset.win);
  update();
});

// drag windows by their title bar (moves the element directly, no re-render while dragging)
let drag = null;
document.addEventListener('mousedown', e => {
  if (VIEW !== 'sim' || e.button !== 0) return;
  const h = e.target.closest('[data-drag]');
  if (!h || e.target.closest('button')) return;
  const w = getWin(h.dataset.drag);
  if (!w) return;
  drag = { w, el: h.closest('.xwin'), sx: e.clientX, sy: e.clientY, ox: w.x, oy: w.y };
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  drag.w.x = Math.max(-300, drag.ox + e.clientX - drag.sx);
  drag.w.y = Math.max(0, drag.oy + e.clientY - drag.sy);
  drag.el.style.left = drag.w.x + 'px';
  drag.el.style.top = drag.w.y + 'px';
});
document.addEventListener('mouseup', () => { drag = null; });

/* ---------------- router ---------------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (parts[0] === 'module') renderModule(parts[1], parts[2]);
  else if (parts[0] === 'sim') startSim(parts[1]);
  else renderHome();
}
window.addEventListener('hashchange', route);
route();
loadLogo();
</script>
